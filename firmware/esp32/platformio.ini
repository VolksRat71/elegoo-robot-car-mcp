; PlatformIO Project Configuration File
; Elegoo Smart Robot Car V4.0 - Custom ESP32 Firmware
;
; Build and upload:
;   pio run -t upload
;
; Monitor serial output:
;   pio device monitor

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_ELEGOO_V4

; Libraries
lib_deps =
    ESP Async WebServer @ ^1.2.3
    ArduinoJson @ ^7.0.0
    AsyncTCP @ ^1.1.1

; Partition scheme with enough space for camera
board_build.partitions = huge_app.csv
