; PlatformIO Project Configuration File
; Elegoo Smart Robot Car V4.0 - Custom ESP32 Firmware
;
; Build and upload:
;   pio run -t upload
;
; Monitor serial output:
;   pio device monitor

[platformio]
; Include secrets (gitignored) - copy secrets.ini.example to secrets.ini
extra_configs = secrets.ini

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Upload settings
upload_port = /dev/cu.usbserial-1140
upload_speed = 921600
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-1140

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_ELEGOO_V4

; Libraries
lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^1.1.1

; Partition scheme with enough space for camera
board_build.partitions = huge_app.csv
